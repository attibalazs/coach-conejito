[project]
name = "coach-conejito"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0",
    "fitparse>=1.2.0",
    "garminconnect>=0.2.8",
    "google-generativeai>=0.8.6",
    "mlx-lm>=0.29.1",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "rich>=13.0.0",
]

[project.scripts]
coach = "src.cli_main:cli"

[tool.uv]
package = true
dev-dependencies = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
